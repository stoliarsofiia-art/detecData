<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" width="340" height="310">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .circle-line { fill: none; stroke: #3a6ab8; stroke-width: 2; }
    .angle-label { font-family: serif; font-size: 16px; fill: #3a6ab8; font-style: italic; }
    .formula { font-family: sans-serif; font-size: 15px; fill: #2B2016; font-weight: bold; }
    .sub { font-family: sans-serif; font-size: 13px; fill: #3a6ab8; }
  </style>

  <!-- Circumscribed circle -->
  <circle class="circle-line" cx="175" cy="135" r="115" />

  <!-- Quadrilateral ABCD inscribed in circle -->
  <polygon class="shape" points="65,185 95,40 300,75 280,240" />

  <!-- Vertex labels -->
  <text class="label" x="40" y="198">A</text>
  <text class="label" x="78" y="30">B</text>
  <text class="label" x="305" y="68">C</text>
  <text class="label" x="285" y="258">D</text>

  <!-- Angle labels -->
  <text class="angle-label" x="82" y="178">α</text>
  <text class="angle-label" x="112" y="58">β</text>
  <text class="angle-label" x="282" y="92">γ</text>
  <text class="angle-label" x="268" y="230">δ</text>

  <!-- Formula -->
  <text class="formula" x="30" y="278">α + γ  =  β + δ  =  180°</text>

  <!-- Subtitle -->
  <text class="sub" x="105" y="298">Описане коло</text>
</svg>
