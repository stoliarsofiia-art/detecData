<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .side-label { font-family: sans-serif; font-size: 14px; fill: #C97820; font-weight: bold; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .median { stroke: #D92626; stroke-width: 2.5; }
    .midpoint { fill: #D92626; }
    .right-angle { fill: none; stroke: #2563EB; stroke-width: 2; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .note { font-family: sans-serif; font-size: 13px; fill: #D92626; font-weight: bold; }
  </style>

  <!-- Right triangle -->
  <polygon class="shape" points="60,210 60,40 340,210" />

  <!-- Right angle mark at A -->
  <polyline class="right-angle" points="60,60 80,60 80,40" transform="translate(0,170) scale(1,-1) translate(0,-40)" />
  <polyline class="right-angle" points="80,210 80,190 60,190" />

  <!-- Median from right angle to hypotenuse -->
  <line class="median" x1="60" y1="210" x2="200" y2="125" />

  <!-- Midpoint M of hypotenuse -->
  <circle class="midpoint" cx="200" cy="125" r="5" />

  <!-- Equal segments marks -->
  <line stroke="#D92626" stroke-width="2" x1="126" y1="82" x2="134" y2="74" />
  <line stroke="#D92626" stroke-width="2" x1="265" y1="164" x2="273" y2="156" />
  <line stroke="#D92626" stroke-width="2" x1="125" y1="170" x2="133" y2="162" />

  <!-- Vertex labels -->
  <text class="label" x="42" y="218">A</text>
  <text class="label" x="42" y="35">B</text>
  <text class="label" x="345" y="218">C</text>

  <!-- Midpoint label -->
  <text class="note" x="208" y="120">M</text>

  <!-- Side labels -->
  <text class="side-label" x="25" y="130">a</text>
  <text class="side-label" x="195" y="228">b</text>
  <text class="side-label" x="210" y="108" transform="rotate(-45, 210, 108)">c</text>

  <!-- Formula -->
  <text class="formula" x="50" y="255">Медіана до гіпотенузи = c/2,  MA = MB = MC</text>
</svg>
