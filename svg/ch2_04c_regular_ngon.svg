<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 355" width="300" height="355">
  <style>
    .label { font-family: sans-serif; font-size: 15px; fill: #2B2016; font-weight: bold; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .circle-R { fill: none; stroke: #E8943A; stroke-width: 2; }
    .circle-r { fill: #e0f4e8; stroke: #3a8a5c; stroke-width: 2; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .formula-R { font-family: sans-serif; font-size: 14px; fill: #E8943A; font-weight: bold; }
    .formula-r { font-family: sans-serif; font-size: 14px; fill: #3a8a5c; font-weight: bold; }
    .formula-S { font-family: sans-serif; font-size: 14px; fill: #2B2016; font-weight: bold; }
    .title { font-family: sans-serif; font-size: 13px; fill: #9b856a; font-weight: bold; }
  </style>

  <!-- Title -->
  <text class="title" x="30" y="20">Правильний n-кутник (загальний)</text>

  <!-- Regular pentagon (n=5) as example, centered at (150,140), R=100 -->
  <polygon class="shape" points="150,40 245,112 209,218 91,218 55,112" />

  <!-- Circumscribed circle R -->
  <circle class="circle-R" cx="150" cy="140" r="100" />

  <!-- Inscribed circle r -->
  <circle class="circle-r" cx="150" cy="140" r="81" />

  <!-- Radius lines from center -->
  <line stroke="#E8943A" stroke-width="1.5" stroke-dasharray="6,3" x1="150" y1="140" x2="150" y2="40" />
  <line stroke="#3a8a5c" stroke-width="1.5" stroke-dasharray="4,3" x1="150" y1="140" x2="150" y2="218" />

  <!-- Center -->
  <circle fill="#E8943A" cx="150" cy="140" r="3" />

  <!-- Labels -->
  <text class="label" x="155" y="85" style="fill:#E8943A;">R</text>
  <text class="label" x="155" y="190" style="fill:#3a8a5c;">r</text>
  <text class="label" x="140" y="238">a</text>

  <!-- Formulas -->
  <text class="formula-R" x="20" y="278">R = a / (2·sin(π/n))</text>
  <text class="formula-r" x="20" y="300">r = a / (2·tan(π/n))</text>
  <text class="formula-S" x="20" y="322">S = ½·n·a·r</text>
</svg>
