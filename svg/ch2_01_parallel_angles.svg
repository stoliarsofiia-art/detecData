<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .line-main { stroke: #E8943A; stroke-width: 2.5; }
    .line-trans { stroke: #2563EB; stroke-width: 2.5; }
    .angle-arc { fill: none; stroke-width: 2; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .note { font-family: sans-serif; font-size: 13px; fill: #D92626; font-weight: bold; }
    .side-label { font-family: sans-serif; font-size: 14px; fill: #C97820; font-weight: bold; }
  </style>

  <!-- Parallel line 1 (top) -->
  <line class="line-main" x1="30" y1="80" x2="370" y2="80" />
  <!-- Parallel line 2 (bottom) -->
  <line class="line-main" x1="30" y1="200" x2="370" y2="200" />

  <!-- Transversal -->
  <line class="line-trans" x1="120" y1="20" x2="280" y2="260" />

  <!-- Parallel arrows -->
  <text class="side-label" x="375" y="78">a</text>
  <text class="side-label" x="375" y="198">b</text>

  <!-- Angle arcs at top intersection -->
  <path class="angle-arc" stroke="#D92626" d="M 190,80 A 20,20 0 0,1 173,67" />
  <path class="angle-arc" stroke="#16A34A" d="M 173,93 A 20,20 0 0,1 190,80" />

  <!-- Angle arcs at bottom intersection -->
  <path class="angle-arc" stroke="#D92626" d="M 250,200 A 20,20 0 0,1 233,187" />
  <path class="angle-arc" stroke="#16A34A" d="M 233,213 A 20,20 0 0,1 250,200" />

  <!-- Angle labels at top -->
  <text class="label" style="fill:#D92626; font-size:16px;" x="178" y="62">1</text>
  <text class="label" style="fill:#16A34A; font-size:16px;" x="155" y="108">2</text>

  <!-- Angle labels at bottom -->
  <text class="label" style="fill:#D92626; font-size:16px;" x="238" y="182">1</text>
  <text class="label" style="fill:#16A34A; font-size:16px;" x="215" y="228">2</text>

  <!-- Intersection points -->
  <circle fill="#E8943A" cx="183" cy="80" r="4" />
  <circle fill="#E8943A" cx="243" cy="200" r="4" />

  <!-- Labels for lines -->
  <text class="label" x="15" y="75">a</text>
  <text class="label" x="15" y="195">b</text>
  <text class="label" x="285" y="258">c</text>

  <!-- Formulas -->
  <text class="formula" x="20" y="268">a || b: Відповідні кути рівні; Сума сусідніх = 180°</text>
</svg>
