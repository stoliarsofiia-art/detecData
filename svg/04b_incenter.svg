<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .bisector { stroke: #16A34A; stroke-width: 1.5; stroke-dasharray: 6,3; }
    .incircle { fill: none; stroke: #D92626; stroke-width: 2; }
    .center { fill: #D92626; stroke: #991B1B; stroke-width: 1.5; }
    .radius { stroke: #D92626; stroke-width: 1; stroke-dasharray: 4,3; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .note { font-family: sans-serif; font-size: 13px; fill: #D92626; font-weight: bold; }
  </style>

  <!-- Triangle ABC -->
  <polygon class="shape" points="50,220 200,30 380,220" />

  <!-- Bisectors -->
  <line class="bisector" x1="50" y1="220" x2="310" y2="97" />
  <line class="bisector" x1="200" y1="30" x2="215" y2="220" />
  <line class="bisector" x1="380" y1="220" x2="105" y2="100" />

  <!-- Inscribed circle -->
  <circle class="incircle" cx="207" cy="163" r="55" />

  <!-- Incenter point I -->
  <circle class="center" cx="207" cy="163" r="5" />

  <!-- Radius line -->
  <line class="radius" x1="207" y1="163" x2="207" y2="220" />

  <!-- Vertex labels -->
  <text class="label" x="30" y="235">A</text>
  <text class="label" x="193" y="22">B</text>
  <text class="label" x="385" y="235">C</text>

  <!-- Incenter label -->
  <text class="note" x="215" y="158">I</text>

  <!-- Radius label -->
  <text class="label" x="212" y="198">r</text>

  <!-- Formula -->
  <text class="formula" x="80" y="270">r = S / p,  де p — півпериметр</text>
</svg>
