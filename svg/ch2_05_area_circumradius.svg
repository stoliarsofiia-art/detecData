<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250" width="330" height="250">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.8; stroke-linejoin: round; }
    .circle-line { fill: none; stroke: #E8943A; stroke-width: 2; }
    .center { fill: #E8943A; }
    .radius { stroke: #c97820; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .formula { font-family: sans-serif; font-size: 16px; fill: #2B2016; font-weight: bold; }
    .side-label { font-family: sans-serif; font-size: 16px; fill: #E8943A; font-weight: bold; }
  </style>

  <!-- Circumscribed circle -->
  <circle class="circle-line" cx="165" cy="110" r="95" />

  <!-- Triangle ABC -->
  <polygon class="shape" points="75,175 165,17 280,185" />

  <!-- Center O -->
  <circle class="center" cx="165" cy="110" r="3.5" />

  <!-- Radius to vertex B -->
  <line class="radius" x1="165" y1="110" x2="165" y2="17" />

  <!-- Vertex labels -->
  <text class="label" x="53" y="190">A</text>
  <text class="label" x="158" y="12">B</text>
  <text class="label" x="285" y="200">C</text>

  <!-- Center label -->
  <text class="label" x="172" y="108">O</text>

  <!-- Radius label -->
  <text class="side-label" x="170" y="68" style="fill:#c97820;">R</text>

  <!-- Side labels -->
  <text class="side-label" x="270" y="105">a</text>
  <text class="side-label" x="100" y="90">b</text>
  <text class="side-label" x="170" y="200">c</text>

  <!-- Formula -->
  <text class="formula" x="55" y="235">S  =  (a · b · c) / (4R)</text>
</svg>
