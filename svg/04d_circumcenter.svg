<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .perp-bisector { stroke: #0891B2; stroke-width: 1.5; stroke-dasharray: 6,3; }
    .circumcircle { fill: none; stroke: #D92626; stroke-width: 2; }
    .center { fill: #D92626; stroke: #991B1B; stroke-width: 1.5; }
    .radius { stroke: #D92626; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .note { font-family: sans-serif; font-size: 13px; fill: #D92626; font-weight: bold; }
  </style>

  <!-- Circumscribed circle -->
  <circle class="circumcircle" cx="200" cy="130" r="120" />

  <!-- Triangle ABC inscribed in circle -->
  <polygon class="shape" points="85,185 200,15 330,200" />

  <!-- Perpendicular bisectors (partial) -->
  <line class="perp-bisector" x1="142" y1="100" x2="142" y2="30" />
  <line class="perp-bisector" x1="265" y1="108" x2="300" y2="40" />
  <line class="perp-bisector" x1="207" y1="193" x2="240" y2="230" />

  <!-- Circumcenter O -->
  <circle class="center" cx="200" cy="130" r="5" />

  <!-- Radius -->
  <line class="radius" x1="200" y1="130" x2="200" y2="15" />

  <!-- Vertex labels -->
  <text class="label" x="65" y="198">A</text>
  <text class="label" x="193" y="12">B</text>
  <text class="label" x="335" y="213">C</text>

  <!-- Circumcenter label -->
  <text class="note" x="208" y="128">O</text>

  <!-- Radius label -->
  <text class="label" x="205" y="75">R</text>

  <!-- Formula -->
  <text class="formula" x="60" y="270">R = a/(2·sin A),  OA = OB = OC = R</text>
</svg>
