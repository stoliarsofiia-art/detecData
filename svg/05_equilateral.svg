<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .side-label { font-family: sans-serif; font-size: 15px; fill: #C97820; font-weight: bold; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .height { stroke: #2563EB; stroke-width: 2; stroke-dasharray: 6,3; }
    .angle-arc { fill: none; stroke: #16A34A; stroke-width: 2; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .angle-label { font-family: sans-serif; font-size: 12px; fill: #16A34A; font-weight: bold; }
  </style>

  <!-- Equilateral triangle -->
  <polygon class="shape" points="70,220 200,30 330,220" />

  <!-- Height -->
  <line class="height" x1="200" y1="30" x2="200" y2="220" />

  <!-- Angle arcs (60 degrees at each vertex) -->
  <path class="angle-arc" d="M 95,220 A 25,25 0 0,1 82,200" />
  <path class="angle-arc" d="M 305,220 A 25,25 0 0,0 318,200" />
  <path class="angle-arc" d="M 188,55 A 25,25 0 0,1 212,55" />

  <!-- Vertex labels -->
  <text class="label" x="50" y="235">A</text>
  <text class="label" x="193" y="22">B</text>
  <text class="label" x="335" y="235">C</text>

  <!-- Side labels -->
  <text class="side-label" x="115" y="115" transform="rotate(-55, 115, 115)">a</text>
  <text class="side-label" x="280" y="115" transform="rotate(55, 280, 115)">a</text>
  <text class="side-label" x="195" y="240">a</text>

  <!-- Angle labels -->
  <text class="angle-label" x="97" y="210">60°</text>
  <text class="angle-label" x="285" y="210">60°</text>
  <text class="angle-label" x="186" y="70">60°</text>

  <!-- Height label -->
  <text class="side-label" x="205" y="135" style="fill: #2563EB;">h</text>

  <!-- Formulas -->
  <text class="formula" x="60" y="265">h = a√3/2,  S = a²√3/4</text>
</svg>
