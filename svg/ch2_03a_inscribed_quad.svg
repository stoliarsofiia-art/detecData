<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 310" width="340" height="310">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .circle-line { fill: none; stroke: #3a8a5c; stroke-width: 2; }
    .circle-fill { fill: #e0f4e8; stroke: #3a8a5c; stroke-width: 2; }
    .formula { font-family: sans-serif; font-size: 15px; fill: #2B2016; font-weight: bold; }
    .sub { font-family: sans-serif; font-size: 13px; fill: #3a8a5c; }
    .side-label { font-family: sans-serif; font-size: 15px; fill: #2B2016; font-weight: bold; }
  </style>

  <!-- Quadrilateral ABCD -->
  <polygon class="shape" points="50,210 100,40 280,50 300,230" />

  <!-- Inscribed circle -->
  <circle class="circle-fill" cx="175" cy="140" r="72" />

  <!-- Side labels -->
  <text class="side-label" x="55" y="120">a</text>
  <text class="side-label" x="180" y="30">b</text>
  <text class="side-label" x="300" y="135">c</text>
  <text class="side-label" x="165" y="240">d</text>

  <!-- Vertex labels -->
  <text class="label" x="28" y="225">A</text>
  <text class="label" x="85" y="30">B</text>
  <text class="label" x="285" y="38">C</text>
  <text class="label" x="305" y="248">D</text>

  <!-- Formula -->
  <text class="formula" x="70" y="278">a + c  =  b + d</text>

  <!-- Subtitle -->
  <text class="sub" x="100" y="298">Вписане коло</text>
</svg>
