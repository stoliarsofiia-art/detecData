<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 355" width="300" height="355">
  <style>
    .label { font-family: sans-serif; font-size: 15px; fill: #2B2016; font-weight: bold; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .circle-R { fill: none; stroke: #E8943A; stroke-width: 2; }
    .circle-r { fill: #e0f4e8; stroke: #3a8a5c; stroke-width: 2; }
    .radius-R { stroke: #E8943A; stroke-width: 1.5; stroke-dasharray: 6,3; }
    .radius-r { stroke: #3a8a5c; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .formula-R { font-family: sans-serif; font-size: 14px; fill: #E8943A; font-weight: bold; }
    .formula-r { font-family: sans-serif; font-size: 14px; fill: #3a8a5c; font-weight: bold; }
    .formula-S { font-family: sans-serif; font-size: 14px; fill: #2B2016; font-weight: bold; }
    .title { font-family: sans-serif; font-size: 14px; fill: #9b856a; font-weight: bold; }
  </style>

  <!-- Title -->
  <text class="title" x="60" y="25">Квадрат (n = 4)</text>

  <!-- Square -->
  <polygon class="shape" points="70,70 230,70 230,230 70,230" />

  <!-- Circumscribed circle R -->
  <circle class="circle-R" cx="150" cy="150" r="113" />

  <!-- Inscribed circle r -->
  <circle class="circle-r" cx="150" cy="150" r="80" />

  <!-- Diagonals -->
  <line stroke="#9b856a" stroke-width="1" stroke-dasharray="6,3" x1="70" y1="70" x2="230" y2="230" />
  <line stroke="#9b856a" stroke-width="1" stroke-dasharray="6,3" x1="230" y1="70" x2="70" y2="230" />

  <!-- Center -->
  <circle fill="#E8943A" cx="150" cy="150" r="3" />

  <!-- Radius labels -->
  <text class="label" x="190" y="108" style="fill:#E8943A;">R</text>
  <text class="label" x="155" y="115" style="fill:#3a8a5c;">r</text>
  <text class="label" x="145" y="62">a</text>

  <!-- Formulas -->
  <text class="formula-R" x="40" y="280">R = a√2 / 2</text>
  <text class="formula-r" x="40" y="302">r = a / 2</text>
  <text class="formula-S" x="40" y="324">S = a²</text>
</svg>
