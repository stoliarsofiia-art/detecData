<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .diag { stroke: #D92626; stroke-width: 1.5; stroke-dasharray: 6,3; }
    .circle-in { fill: none; stroke: #2563EB; stroke-width: 1.5; }
    .circle-out { fill: none; stroke: #D92626; stroke-width: 1.5; }
    .center { fill: #D92626; stroke: #991B1B; stroke-width: 1.5; }
    .right-angle { fill: none; stroke: #2563EB; stroke-width: 1.5; }
    .formula { font-family: sans-serif; font-size: 13px; fill: #2B2016; }
    .note { font-family: sans-serif; font-size: 13px; fill: #D92626; font-weight: bold; }
    .side-label { font-family: sans-serif; font-size: 14px; fill: #C97820; font-weight: bold; }
  </style>

  <!-- Square -->
  <polygon class="shape" points="100,60 300,60 300,220 100,220" />

  <!-- Diagonals -->
  <line class="diag" x1="100" y1="60" x2="300" y2="220" />
  <line class="diag" x1="300" y1="60" x2="100" y2="220" />

  <!-- Inscribed circle -->
  <circle class="circle-in" cx="200" cy="140" r="80" />

  <!-- Circumscribed circle -->
  <circle class="circle-out" cx="200" cy="140" r="113" />

  <!-- Center -->
  <circle class="center" cx="200" cy="140" r="4" />

  <!-- Right angle marks -->
  <polyline class="right-angle" points="120,60 120,80 100,80" />

  <!-- Vertex labels -->
  <text class="label" x="82" y="52">A</text>
  <text class="label" x="305" y="52">B</text>
  <text class="label" x="305" y="238">C</text>
  <text class="label" x="82" y="238">D</text>

  <!-- Center label -->
  <text class="note" x="208" y="136">O</text>

  <!-- Side labels -->
  <text class="side-label" x="195" y="52">a</text>

  <!-- Diagonal label -->
  <text class="side-label" x="240" y="120" style="fill:#D92626;">d</text>

  <!-- Radius labels -->
  <text class="side-label" x="205" y="100" style="fill:#2563EB;">r</text>
  <text class="side-label" x="245" y="78" style="fill:#D92626;">R</text>

  <!-- Formulas -->
  <text class="formula" x="30" y="260">d = a\u221A2,  S = a\u00B2,  r = a/2,  R = a\u221A2/2</text>
  <text class="formula" x="30" y="280">P = 4a,  \u03B1 = 90\u00B0</text>
</svg>
