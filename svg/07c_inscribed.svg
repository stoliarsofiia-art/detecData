<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <style>
    .label { font-family: serif; font-size: 18px; font-style: italic; fill: #2B2016; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .circle-line { fill: none; stroke: #2563EB; stroke-width: 2; }
    .center { fill: #D92626; stroke: #991B1B; stroke-width: 1.5; }
    .radius { stroke: #D92626; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .tangent-point { fill: #2563EB; }
    .formula { font-family: sans-serif; font-size: 14px; fill: #2B2016; }
    .note { font-family: sans-serif; font-size: 13px; fill: #D92626; font-weight: bold; }
    .side-label { font-family: sans-serif; font-size: 14px; fill: #C97820; font-weight: bold; }
  </style>

  <!-- Triangle -->
  <polygon class="shape" points="50,220 200,25 380,220" />

  <!-- Inscribed circle -->
  <circle class="circle-line" cx="210" cy="163" r="55" />

  <!-- Incenter I -->
  <circle class="center" cx="210" cy="163" r="5" />

  <!-- Radii to tangent points -->
  <line class="radius" x1="210" y1="163" x2="210" y2="220" />
  <line class="radius" x1="210" y1="163" x2="155" y2="138" />
  <line class="radius" x1="210" y1="163" x2="265" y2="138" />

  <!-- Tangent points -->
  <circle class="tangent-point" cx="210" cy="220" r="3" />
  <circle class="tangent-point" cx="155" cy="138" r="3" />
  <circle class="tangent-point" cx="265" cy="138" r="3" />

  <!-- Vertex labels -->
  <text class="label" x="30" y="235">A</text>
  <text class="label" x="193" y="18">B</text>
  <text class="label" x="385" y="235">C</text>

  <!-- Tangent point labels -->
  <text class="label" x="215" y="238">T_c</text>
  <text class="label" x="133" y="132">T_b</text>
  <text class="label" x="270" y="132">T_a</text>

  <!-- Center label -->
  <text class="note" x="218" y="160">I</text>

  <!-- Radius label -->
  <text class="side-label" x="215" y="198" style="fill: #D92626;">r</text>

  <!-- Formula -->
  <text class="formula" x="70" y="268">r = S / p,  де p = (a+b+c)/2</text>
</svg>
