<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 360" width="290" height="360">
  <style>
    .label { font-family: sans-serif; font-size: 15px; fill: #2B2016; font-weight: bold; }
    .shape { fill: #FEF0DC; stroke: #E8943A; stroke-width: 2.5; stroke-linejoin: round; }
    .circle-R { fill: none; stroke: #E8943A; stroke-width: 2; }
    .circle-r { fill: #e0f4e8; stroke: #3a8a5c; stroke-width: 2; }
    .formula { font-family: sans-serif; font-size: 13px; fill: #2B2016; }
    .formula-R { font-family: sans-serif; font-size: 13px; fill: #E8943A; font-weight: bold; }
    .formula-r { font-family: sans-serif; font-size: 13px; fill: #3a8a5c; font-weight: bold; }
    .formula-S { font-family: sans-serif; font-size: 13px; fill: #2B2016; font-weight: bold; }
    .title { font-family: sans-serif; font-size: 13px; fill: #9b856a; font-weight: bold; }
    .highlight { font-family: sans-serif; font-size: 12px; fill: #b83a3a; font-weight: bold; }
  </style>

  <!-- Title -->
  <text class="title" x="25" y="20">Правильний шестикутник (n = 6)</text>

  <!-- Regular hexagon centered at (145,145), R=95 -->
  <polygon class="shape" points="240,145 192.5,227 97.5,227 50,145 97.5,63 192.5,63" />

  <!-- Circumscribed circle R -->
  <circle class="circle-R" cx="145" cy="145" r="95" />

  <!-- Inscribed circle r -->
  <circle class="circle-r" cx="145" cy="145" r="82" />

  <!-- Internal triangle lines from center -->
  <line stroke="#9b856a" stroke-width="1" x1="145" y1="145" x2="192.5" y2="63" />
  <line stroke="#9b856a" stroke-width="1" x1="145" y1="145" x2="97.5" y2="63" />
  <line stroke="#9b856a" stroke-width="1" x1="145" y1="145" x2="240" y2="145" />

  <!-- Center -->
  <circle fill="#E8943A" cx="145" cy="145" r="3" />

  <!-- Labels -->
  <text class="label" x="200" y="140" style="fill:#E8943A;">R</text>
  <text class="label" x="155" y="108" style="fill:#3a8a5c;">r</text>
  <text class="label" x="135" y="56">a</text>

  <!-- Formulas -->
  <text class="formula-R" x="20" y="268">R = a  ← R дорівнює стороні!</text>
  <text class="formula-r" x="20" y="290">r = a√3 / 2</text>
  <text class="formula-S" x="20" y="312">S = 3a²√3 / 2</text>

  <!-- Highlight -->
  <text class="highlight" x="10" y="340">★ У шестикутнику: R = a (унікальна властивість!)</text>
</svg>
